# CI for the PUBLIC mirror (github.com/fileseal/mcp-send).
# Synced into place as .github/workflows/ci.yml by scripts/sync-mcp-public.sh —
# it is NOT a workflow of the FileSeal application repo, which is why it lives
# under this name rather than in .github/workflows/ here.
#
# Deliberately minimal. The package's real integration tests (smoke.mjs,
# mcp-check.mjs) need a live API key and a running FileSeal instance, so they
# stay in the private repo; a public CI that needed a secret to pass would just
# be a permanently red badge.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the declared engines floor, and it is in the matrix so the floor
        # is PROVEN rather than asserted. It matters here: globalThis.crypto sat
        # behind --experimental-global-webcrypto until Node 19, and crypto.mjs
        # uses it, so on an unsupported runtime the server would start, advertise
        # its tools, and only throw on the first secure_send — the worst shape
        # for a published package. package.json said ">=18" until a review
        # pointed this out.
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - name: Syntax check
        run: node --check index.mjs && node --check crypto.mjs
      - name: Server starts and advertises its tools
        # Pure ESM, and --input-type=module BEFORE -e. The first version mixed
        # require() with top-level await and put the flag after the script, so
        # Node could not determine the module format and CI failed red on the
        # mirror's very first push.
        run: |
          node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          import { Client } from '@modelcontextprotocol/sdk/client/index.js';
          import { StdioClientTransport } from '@modelcontextprotocol/sdk/client/stdio.js';
          const t = new StdioClientTransport({ command: 'node', args: ['index.mjs'], env: { ...process.env, FILESEAL_API_KEY: 'ci-dummy-key' } });
          const c = new Client({ name: 'ci', version: '0.0.0' });
          await c.connect(t);
          const info = c.getServerVersion();
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (info.version !== pkg.version) throw new Error('reported version ' + info.version + ' != package.json ' + pkg.version);
          const { tools } = await c.listTools();
          const names = tools.map((x) => x.name).sort().join(',');
          if (names !== 'revoke_send,secure_send,send_status') throw new Error('unexpected tools: ' + names);
          await c.close();
          console.log('ok: v' + info.version + ' advertising ' + names);
          "

      # The tool path itself, against a local stub of /v1/sends. Needs no API
      # key and no running FileSeal instance, which is why it can live here:
      # it asserts the zero-knowledge invariant (link mode must not send the
      # encryption key, email mode must), which is a property of the request
      # body that no unit test can pin.
      - name: Tool path end to end against a stub API
        run: node stub-e2e.mjs
